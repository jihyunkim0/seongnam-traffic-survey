<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>성남시 교통체계개선사업 혼잡구간 조사</title>

  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=8z72u21kct"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    input, textarea, select, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 15px;
    }

    #map {
      width: 100%;
      height: 500px;
      margin: 16px 0;
      border: 1px solid #ddd;
    }

    .box {
      padding: 16px;
      background: #f7f8fa;
      border-radius: 10px;
      margin-top: 12px;
    }

    button {
      background: #0068ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .gray-btn {
      background: #666;
    }

    .red-btn {
      background: #d93025;
      width: auto;
      padding: 6px 10px;
      font-size: 13px;
      margin-left: 8px;
    }

    .guide {
      background: #eef5ff;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.6;
      margin: 12px 0;
    }

    li {
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .small {
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>
  <h2>성남시 교통체계개선사업 혼잡구간 의견조사</h2>

  <input id="organization" placeholder="소속" />
  <input id="name" placeholder="이름" />
  <input id="phone" placeholder="연락처" />

  <div class="guide">
    지도에서 혼잡구간의 <b>시작점</b>과 <b>끝점</b>을 차례로 클릭해주세요.<br>
    도로가 꺾이는 구간은 중간 지점을 추가로 클릭하면 됩니다.
  </div>

  <div id="map"></div>

  <div class="box">
    <button class="gray-btn" onclick="resetCurrentLine()">현재 표시한 구간 다시 그리기</button>

    <select id="issueType">
      <option value="">문제유형을 선택해주세요.</option>
      <option value="차량정체">차량정체</option>
      <option value="보행불편">보행불편</option>
      <option value="자전거불편">자전거불편</option>
      <option value="대중교통불편">대중교통불편</option>
      <option value="주차문제">주차문제</option>
      <option value="교통안전">교통안전</option>
      <option value="기타">기타</option>
    </select>

    <textarea id="memo" rows="4" placeholder="혼잡 시간대, 혼잡 원인, 개선 의견 등을 작성해주세요."></textarea>

    <button onclick="saveSection()">혼잡구간 저장</button>
  </div>

  <h3>저장된 혼잡구간</h3>
  <p class="small">잘못 저장한 구간은 삭제할 수 있습니다.</p>
  <ul id="sectionList"></ul>

  <button id="submitBtn" onclick="submitSurvey()">최종 제출</button>

  <iframe name="hiddenFrame" style="display:none;"></iframe>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzMw_B8AKWkji2nR3bBWXbjsBLJZYcZ8nG_9lQ36cx5ZK8MwclkZZPgC-5X-yiltC8/exec";

    const map = new naver.maps.Map("map", {
      center: new naver.maps.LatLng(37.4201, 127.1265),
      zoom: 11
    });

    let currentPath = [];
    let currentPolyline = null;
    let currentMarkers = [];
    let sections = [];

    naver.maps.Event.addListener(map, "click", function(e) {
      addPoint(e.coord);
    });

    function addPoint(coord) {
      currentPath.push(coord);

      const marker = new naver.maps.Marker({
        position: coord,
        map: map
      });

      currentMarkers.push(marker);

      if (!currentPolyline) {
        currentPolyline = new naver.maps.Polyline({
          map: map,
          path: currentPath,
          strokeColor: "#ff0000",
          strokeWeight: 5,
          strokeOpacity: 0.9
        });
      } else {
        currentPolyline.setPath(currentPath);
      }
    }

    function resetCurrentLine() {
      currentPath = [];

      if (currentPolyline) {
        currentPolyline.setMap(null);
        currentPolyline = null;
      }

      currentMarkers.forEach(marker => marker.setMap(null));
      currentMarkers = [];
    }

    function saveSection() {
      const issueType = document.getElementById("issueType").value;
      const memo = document.getElementById("memo").value.trim();

      if (currentPath.length < 2) {
        alert("혼잡구간은 최소 2개 지점을 클릭해야 저장할 수 있습니다.");
        return;
      }

      if (!issueType) {
        alert("문제유형을 선택해주세요.");
        return;
      }

      if (!memo) {
        alert("혼잡구간 메모를 입력해주세요.");
        return;
      }

      const path = currentPath.map(coord => ({
        lat: coord.lat(),
        lng: coord.lng()
      }));

      const savedPolyline = currentPolyline;
      const savedMarkers = currentMarkers.slice();

      sections.push({
        issueType: issueType,
        path: path,
        memo: memo,
        polyline: savedPolyline,
        markers: savedMarkers
      });

      document.getElementById("memo").value = "";
      document.getElementById("issueType").value = "";

      currentPath = [];
      currentPolyline = null;
      currentMarkers = [];

      renderSectionList();

      alert("혼잡구간이 저장되었습니다. 추가 구간이 있으면 지도에서 다시 지점을 클릭해주세요.");
    }

    function renderSectionList() {
      const list = document.getElementById("sectionList");
      list.innerHTML = "";

      sections.forEach((section, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
          <b>혼잡구간 ${index + 1}</b> [${section.issueType}] : ${section.memo}
          <button class="red-btn" onclick="deleteSection(${index})">삭제</button>
        `;
        list.appendChild(li);
      });
    }

    function deleteSection(index) {
      const section = sections[index];

      if (section.polyline) {
        section.polyline.setMap(null);
      }

      if (section.markers) {
        section.markers.forEach(marker => marker.setMap(null));
      }

      sections.splice(index, 1);
      renderSectionList();
    }

    function submitSurvey() {
      const organization = document.getElementById("organization").value.trim();
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      if (!organization || !name || !phone) {
        alert("소속, 이름, 연락처를 모두 입력해주세요.");
        return;
      }

      if (sections.length === 0) {
        alert("혼잡구간을 1개 이상 저장해주세요.");
        return;
      }

      const cleanSections = sections.map(section => ({
        issueType: section.issueType,
        path: section.path,
        memo: section.memo
      }));

      const payload = JSON.stringify({
        organization,
        name,
        phone,
        sections: cleanSections
      });

      const form = document.createElement("form");
      form.method = "POST";
      form.action = WEB_APP_URL;
      form.target = "hiddenFrame";

      const input = document.createElement("input");
      input.type = "hidden";
      input.name = "payload";
      input.value = payload;

      form.appendChild(input);
      document.body.appendChild(form);

      submitBtn.disabled = true;
      submitBtn.textContent = "제출 중입니다...";

      form.submit();

      setTimeout(() => {
        alert("제출되었습니다. 감사합니다.");
        location.reload();
      }, 1200);
    }
  </script>
</body>
</html>
